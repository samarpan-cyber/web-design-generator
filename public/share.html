<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="referrer" content="no-referrer">
<title>Private design preview</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%237c5cff'/%3E%3Cpath d='M8 20l5-8 4 6 3-4 4 6' stroke='white' stroke-width='2.4' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/styles.css">
<style>
.sh-main{max-width:1180px;margin:0 auto;padding:clamp(28px,6vw,64px) 20px 90px}
.sh-hero h1{font-size:clamp(32px,5vw,60px);line-height:1.02;letter-spacing:-.045em;margin:0 0 14px}
.sh-hero .sub{margin-bottom:34px}
.sh-state{min-height:70vh;display:grid;place-content:center;text-align:center;padding:24px;gap:10px}.sh-state h1{font-size:clamp(28px,4vw,46px);letter-spacing:-.04em;margin:0}.sh-state p{color:var(--muted);max-width:46ch;margin:0 auto}
.sh-note{color:var(--muted);font-size:13px;margin-top:30px;text-align:center}
.pill{display:inline-flex;gap:8px;align-items:center;padding:7px 14px;border-radius:99px;border:1px solid rgba(25,211,180,.4);background:rgba(25,211,180,.08);font-size:13px;font-weight:600;margin-bottom:18px}
.pill i{width:8px;height:8px;border-radius:50%;background:var(--acc2)}
</style>
</head>
<body>
<header class="top">
  <div class="brand"><span class="mark"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3 16l5-8 4 6 3-4 6 6"/></svg></span><b id="shAgency">Design concepts</b></div>
  <div class="who"><span class="who-name" id="shExpiry" style="display:inline"></span></div>
</header>

<main class="sh-main" id="shMain" hidden>
  <section class="sh-hero">
    <span class="pill"><i></i>Private preview</span>
    <h1 id="shTitle"></h1>
    <p class="sub" id="shSub">Five fresh ways your website could look. Tap any concept to explore all five pages, switch between dark and light, and try it on a phone.</p>
  </section>
  <div class="grid" id="grid"></div>
  <p class="sh-note">This page is private. Please do not forward the link, it stops working on its own.</p>
</main>
<footer id="shBy" class="sh-by" hidden></footer>

<main class="sh-state" id="shState"><h1 id="shStateTitle">Opening your preview</h1><p id="shStateText">One moment.</p><div id="shStateWho" class="by-state"></div></main>

<div class="viewer" id="viewer" hidden role="dialog" aria-label="Full design preview">
  <div class="v-bar">
    <button class="primary" id="vClose">&larr; Back to all five</button>
    <div class="v-title"><b id="vName"></b><span id="vCount"></span></div>
    <div class="seg" id="devSeg"><button data-d="100%" class="on">Desktop</button><button data-d="820px">Tablet</button><button data-d="390px">Phone</button></div>
    <div class="seg" id="vThemeSeg"><button data-t="dark">Dark</button><button data-t="light">Light</button></div>
    <div class="v-nav"><button class="ghost" id="vPrev" aria-label="Previous design">&larr;</button><button class="ghost" id="vNext" aria-label="Next design">&rarr;</button></div>
  </div>
  <div class="v-body"><iframe id="vFrame" title="Full preview" sandbox="allow-scripts allow-popups allow-popups-to-escape-sandbox"></iframe></div>
</div>
<script type="module" src="/share.js"></script>
</body>
</html>
